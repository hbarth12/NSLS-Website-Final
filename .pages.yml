media:
  input: ISLS/assets/uploads
  output: assets/uploads

content:
  - name: publications
    label: Publications
    type: file
    path: ISLS/content/publications-bilingual.json
    format: json
    fields:
      - name: publications
        label: Publications
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{en.title}"
        fields:
          # Shared fields (one value for both languages).
          - name: slug
            label: Slug
            type: string
            description: "Lowercase words separated by hyphens, e.g. credit-strategy-reconstruction. Used to build this publication's URL in both languages."

          - name: type
            label: Type
            type: select
            options:
              values:
                - name: memo
                  label: Memo
                - name: commentary
                  label: Commentary
                - name: policy-paper
                  label: Policy Paper
                - name: institutional-note
                  label: Institutional Note

          - name: publicationFormat
            label: Publication Format
            type: select
            default: external
            description: "Choose whether this item links out, appears as a website article, or offers a PDF download."
            options:
              values:
                - name: external
                  label: External link
                - name: page
                  label: Website article
                - name: pdf
                  label: PDF download

          - name: source
            label: Source
            type: string
            default: NSLS

          - name: date
            label: Date
            type: string
            description: "ISO format: YYYY-MM-DD, or YYYY-MM if only the month is known (e.g. 2026-05-21 or 2026-07). Each language page formats this for display itself."

          - name: featured
            label: Featured
            type: boolean
            default: false

          - name: external
            label: External Link (legacy)
            type: boolean
            default: false
            description: "Legacy field. New entries should use Publication Format instead."

          - name: image
            label: Image
            type: string
            required: false
            description: "Either a path to an uploaded image (e.g. assets/uploads/name.png -- add the file to that folder first) or a full external image URL. A plain text field is used here because Pages CMS's image field validates file extensions even on pasted URLs, and external image URLs like the microlink.io preview links this site uses don't have a real file extension. Shared by both language pages."

          - name: mark
            label: Fallback Mark
            type: string
            required: false
            description: "Used when no image is set, e.g. NSLS."

          - name: url
            label: External URL
            type: string
            required: false
            description: "Use for external pieces. On-site pages and PDFs use the slug unless you need a fallback URL."

          # Per-language fields.
          - name: en
            label: English
            type: object
            fields:
              - name: label
                label: Display Label
                type: select
                options:
                  values: ["Memo", "Commentary", "Policy Paper", "Institutional Note"]
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
                description: "Short summary used on publication lists and at the top of publication pages."
              - name: author
                label: Author
                type: string
                required: false
              - name: readTime
                label: Read Time
                type: string
                required: false
                description: "Example: 28 min read."
              - name: imageAlt
                label: Image Alt Text
                type: string
                required: false
              - name: topics
                label: Topics
                type: string
                list: true
                required: false
              - name: pdf
                label: PDF Upload (English)
                type: file
                required: false
                description: "English-language PDF for PDF-download entries."
                options:
                  extensions: ["pdf"]
              - name: pdfLabel
                label: PDF Button Label
                type: string
                required: false
                default: "Download PDF"
              - name: body
                label: Article Body
                type: text
                required: false
                description: "Use for website articles. Supports Markdown, including links: [link text](https://example.com)."

          - name: ar
            label: Arabic
            type: object
            fields:
              - name: label
                label: Display Label
                type: select
                options:
                  values:
                    - name: "مذكرة"
                      label: "مذكرة (Memo)"
                    - name: "تعليق"
                      label: "تعليق (Commentary)"
                    - name: "ورقة سياسات"
                      label: "ورقة سياسات (Policy Paper)"
                    - name: "مذكرة مؤسسية"
                      label: "مذكرة مؤسسية (Institutional Note)"
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
                description: "Short summary used on publication lists and at the top of publication pages."
              - name: author
                label: Author
                type: string
                required: false
              - name: readTime
                label: Read Time
                type: string
                required: false
                description: "Example: 28 دقيقة قراءة."
              - name: imageAlt
                label: Image Alt Text
                type: string
                required: false
              - name: topics
                label: Topics
                type: string
                list: true
                required: false
              - name: pdf
                label: PDF Upload (Arabic)
                type: file
                required: false
                description: "Arabic-language PDF for PDF-download entries."
                options:
                  extensions: ["pdf"]
              - name: pdfLabel
                label: PDF Button Label
                type: string
                required: false
                default: "تحميل PDF"
              - name: body
                label: Article Body
                type: text
                required: false
                description: "Use for website articles. Supports Markdown, including links: [link text](https://example.com)."

  - name: parliamentary-record
    label: Parliamentary Record
    type: file
    path: ISLS/content/parliamentary-record-bilingual.json
    format: json
    fields:
      - name: sessions
        label: Sessions
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} · {en.title} {ar.title}"
        fields:
          # Shared fields (one value for both languages).
          - name: slug
            label: Slug
            type: string
            required: true
            description: "Lowercase words separated by hyphens, e.g. plenary-2026-10-14-budget. Used to build this session's URL in both languages. Don't change it after publishing."

          - name: placeholder
            label: Placeholder (not for search engines)
            type: boolean
            default: false
            description: "Sample or test entry: its pages are marked noindex and left out of the sitemap, and the page shows a 'placeholder' banner. The two PLACEHOLDER sessions that came with this section should be deleted before launch."

          - name: date
            label: Session Date
            type: string
            required: true
            description: "ISO format: YYYY-MM-DD (e.g. 2026-10-14). Sessions are listed newest first."

          - name: sessionNumber
            label: Session Number
            type: string
            required: false
            description: "Optional, e.g. 12."

          - name: type
            label: Session Type
            type: select
            required: true
            default: plenary
            description: "Drives the listing page's type filter."
            options:
              values:
                - name: plenary
                  label: Plenary
                - name: committee
                  label: Committee
                - name: other
                  label: Other

          - name: sourceVideoUrl
            label: Source Video URL
            type: string
            required: false
            description: "Full link to the public video of the session. Adds a 'Watch source video' button to both language pages."

          # Per-language fields. A language is published only once it has a
          # Title and a Transcript; leave a language's block empty until its
          # translation is ready and no page is created for it.
          - name: en
            label: English
            type: object
            fields:
              - name: title
                label: Title
                type: string
              - name: typeLabel
                label: Session Type Label
                type: select
                options:
                  values: ["Plenary", "Committee", "Other"]
              - name: summary
                label: Summary
                type: text
                description: "One or two sentences. Shown on the listing card, at the top of the session page and as the search-engine description."
              - name: speakers
                label: Speakers
                type: string
                list: true
                required: false
              - name: tags
                label: Topic Tags
                type: string
                list: true
                required: false
                description: "Used by the listing page's tag filter."
              - name: transcript
                label: Full Transcript
                type: text
                description: "One speaker turn per paragraph, with a blank line between turns. Each turn: optional timestamp, optional [Studio] marker, then 'Name: remarks', e.g. '[00:00:45] Member A: Thank you, Mr. Speaker.' or '[00:03:05] [Studio] Presenter: For viewers just joining...'. A paragraph in parentheses, e.g. '(The session is adjourned.)', is shown as a procedural note."
              - name: accuracyNote
                label: Accuracy / Translation Note (required)
                type: text
                description: "Required whenever this language has a transcript (the site won't build without it). Shown prominently above the transcript, e.g. who prepared it, from what source, and whether it's a translation."
              - name: sourceCredit
                label: Source Credit
                type: string
                required: false
                description: "e.g. Public broadcast of the People's Assembly. Markdown links allowed: [text](https://...)."
              - name: pdf
                label: PDF Upload (English)
                type: file
                required: false
                options:
                  extensions: ["pdf"]
              - name: pdfLabel
                label: PDF Button Label
                type: string
                required: false
                default: "Download PDF"

          - name: ar
            label: Arabic
            type: object
            fields:
              - name: title
                label: Title
                type: string
              - name: typeLabel
                label: Session Type Label
                type: select
                options:
                  values:
                    - name: "جلسة عامة"
                      label: "جلسة عامة (Plenary)"
                    - name: "جلسة لجنة"
                      label: "جلسة لجنة (Committee)"
                    - name: "أخرى"
                      label: "أخرى (Other)"
              - name: summary
                label: Summary
                type: text
                description: "One or two sentences. Shown on the listing card, at the top of the session page and as the search-engine description."
              - name: speakers
                label: Speakers
                type: string
                list: true
                required: false
              - name: tags
                label: Topic Tags
                type: string
                list: true
                required: false
                description: "Used by the listing page's tag filter."
              - name: transcript
                label: Full Transcript
                type: text
                description: "One speaker turn per paragraph, with a blank line between turns. Each turn: optional timestamp, optional [استوديو] marker, then 'Name: remarks', e.g. '[00:00:45] العضو (أ): شكراً سيادة الرئيس.' A paragraph in parentheses is shown as a procedural note."
              - name: accuracyNote
                label: Accuracy / Translation Note (required)
                type: text
                description: "Required whenever this language has a transcript (the site won't build without it). Shown prominently above the transcript."
              - name: sourceCredit
                label: Source Credit
                type: string
                required: false
              - name: pdf
                label: PDF Upload (Arabic)
                type: file
                required: false
                options:
                  extensions: ["pdf"]
              - name: pdfLabel
                label: PDF Button Label
                type: string
                required: false
                default: "تحميل PDF"
