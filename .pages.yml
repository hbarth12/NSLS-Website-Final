media:
  input: ISLS/assets/uploads
  output: assets/uploads

content:
  - name: publications
    label: Publications
    type: file
    path: ISLS/content/publications-bilingual.json
    format: json
    fields:
      - name: publications
        label: Publications
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{en.title}"
        fields:
          # Shared fields (one value for both languages).
          - name: slug
            label: Slug
            type: string
            description: "Lowercase words separated by hyphens, e.g. credit-strategy-reconstruction. Used to build this publication's URL in both languages."

          - name: type
            label: Type
            type: select
            options:
              values:
                - name: memo
                  label: Memo
                - name: commentary
                  label: Commentary
                - name: policy-paper
                  label: Policy Paper
                - name: institutional-note
                  label: Institutional Note

          - name: publicationFormat
            label: Publication Format
            type: select
            default: external
            description: "Choose whether this item links out, appears as a website article, or offers a PDF download."
            options:
              values:
                - name: external
                  label: External link
                - name: page
                  label: Website article
                - name: pdf
                  label: PDF download

          - name: source
            label: Source
            type: string
            default: NSLS

          - name: date
            label: Date
            type: string
            description: "ISO format: YYYY-MM-DD, or YYYY-MM if only the month is known (e.g. 2026-05-21 or 2026-07). Each language page formats this for display itself."

          - name: featured
            label: Featured
            type: boolean
            default: false

          - name: external
            label: External Link (legacy)
            type: boolean
            default: false
            description: "Legacy field. New entries should use Publication Format instead."

          - name: image
            label: Image
            type: string
            required: false
            description: "Either a path to an uploaded image (e.g. assets/uploads/name.png -- add the file to that folder first) or a full external image URL. A plain text field is used here because Pages CMS's image field validates file extensions even on pasted URLs, and external image URLs like the microlink.io preview links this site uses don't have a real file extension. Shared by both language pages."

          - name: mark
            label: Fallback Mark
            type: string
            required: false
            description: "Used when no image is set, e.g. NSLS."

          - name: url
            label: External URL
            type: string
            required: false
            description: "Use for external pieces. On-site pages and PDFs use the slug unless you need a fallback URL."

          # Per-language fields.
          - name: en
            label: English
            type: object
            fields:
              - name: label
                label: Display Label
                type: select
                options:
                  values: ["Memo", "Commentary", "Policy Paper", "Institutional Note"]
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
                description: "Short summary used on publication lists and at the top of publication pages."
              - name: author
                label: Author
                type: string
                required: false
              - name: readTime
                label: Read Time
                type: string
                required: false
                description: "Example: 28 min read."
              - name: imageAlt
                label: Image Alt Text
                type: string
                required: false
              - name: topics
                label: Topics
                type: string
                list: true
                required: false
              - name: pdf
                label: PDF Upload (English)
                type: file
                required: false
                description: "English-language PDF for PDF-download entries."
                options:
                  extensions: ["pdf"]
              - name: pdfLabel
                label: PDF Button Label
                type: string
                required: false
                default: "Download PDF"
              - name: body
                label: Article Body
                type: text
                required: false
                description: "Use for website articles. Supports Markdown, including links: [link text](https://example.com)."

          - name: ar
            label: Arabic
            type: object
            fields:
              - name: label
                label: Display Label
                type: select
                options:
                  values: ["مذكرة", "تعليق", "ورقة سياسات", "مذكرة مؤسسية"]
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
                description: "Short summary used on publication lists and at the top of publication pages."
              - name: author
                label: Author
                type: string
                required: false
              - name: readTime
                label: Read Time
                type: string
                required: false
                description: "Example: 28 دقيقة قراءة."
              - name: imageAlt
                label: Image Alt Text
                type: string
                required: false
              - name: topics
                label: Topics
                type: string
                list: true
                required: false
              - name: pdf
                label: PDF Upload (Arabic)
                type: file
                required: false
                description: "Arabic-language PDF for PDF-download entries."
                options:
                  extensions: ["pdf"]
              - name: pdfLabel
                label: PDF Button Label
                type: string
                required: false
                default: "تحميل PDF"
              - name: body
                label: Article Body
                type: text
                required: false
                description: "Use for website articles. Supports Markdown, including links: [link text](https://example.com)."
