name: Sync publications data

on:
  push:
    branches:
      - main
    paths:
      - 'ISLS/content/publications-bilingual.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sync-publications.py
        run: python3 ISLS/scripts/sync-publications.py

      - name: Generate static publication pages and sitemap entries
        run: python3 ISLS/scripts/generate-publication-pages.py

      - name: Open pull request with regenerated files
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync publications-data.js, publication pages, and sitemap from publications-bilingual.json"
          title: "chore: sync publications-data.js, publication pages, and sitemap from publications-bilingual.json"
          body: |
            Auto-generated by the `sync-publications` workflow after a change to
            `ISLS/content/publications-bilingual.json`. Regenerates the
            `file://`-preview fallback file by running
            `scripts/sync-publications.py`, and the static per-publication pages
            (both languages) plus the generated block of `sitemap.xml`
            publication entries by running
            `scripts/generate-publication-pages.py`.
          branch: sync-publications-data
          base: main
          add-paths: |
            ISLS/publications-data.js
            ISLS/publications/
            ISLS/ar/publications/
            ISLS/sitemap.xml
          delete-branch: true
