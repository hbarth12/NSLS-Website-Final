name: Sync Parliamentary Record

on:
  push:
    branches:
      - main
    paths:
      - 'ISLS/content/parliamentary-record-bilingual.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate session pages, listing data, and sitemap entries
        run: python3 ISLS/scripts/generate-parliamentary-record.py

      - name: Open pull request with regenerated files
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync Parliamentary Record pages, listing data, and sitemap from parliamentary-record-bilingual.json"
          title: "chore: sync Parliamentary Record pages, listing data, and sitemap from parliamentary-record-bilingual.json"
          body: |
            Auto-generated by the `sync-parliamentary-record` workflow after a
            change to `ISLS/content/parliamentary-record-bilingual.json`.
            Regenerates the static session pages (each published language),
            `parliamentary-record-data.js` (the listing pages' only data
            source), and the generated Parliamentary Record block of
            `sitemap.xml` by running `scripts/generate-parliamentary-record.py`.

            The listing only shows what is in `parliamentary-record-data.js`,
            so new sessions appear on the site when this PR is merged --
            together with their pages, never before.
          branch: sync-parliamentary-record
          base: main
          add-paths: |
            ISLS/parliamentary-record-data.js
            ISLS/parliamentary-record/
            ISLS/ar/parliamentary-record/
            ISLS/sitemap.xml
          delete-branch: true
