backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME
  branch: main

# Allows `npx decap-server` local editing later, if you want it.
local_backend: true

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "site_data"
    label: "Site Data"
    files:
      - name: "publications"
        label: "Publications"
        file: "content/publications.json"
        format: "json"
        fields:
          - label: "Publications"
            name: "publications"
            widget: "list"
            summary: "{{fields.title}}"
            label_singular: "Publication"
            fields:
              - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
              - label: "Publication Format"
                name: "publicationFormat"
                widget: "select"
                default: "external"
                hint: "Choose whether this item links out, appears as a website article, or offers a PDF download."
                options:
                  - { label: "External link", value: "external" }
                  - { label: "Website article", value: "page" }
                  - { label: "PDF download", value: "pdf" }
              - { label: "Slug", name: "slug", widget: "string", required: false, hint: "Required for website articles and PDFs. Use lowercase words separated by hyphens, e.g. credit-strategy-reconstruction." }
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "Memo", value: "memo" }
                  - { label: "Commentary", value: "commentary" }
                  - { label: "Policy Paper", value: "policy-paper" }
                  - { label: "Institutional Note", value: "institutional-note" }
              - label: "Display Label"
                name: "label"
                widget: "select"
                options: ["Memo", "Commentary", "Policy Paper", "Institutional Note"]
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", hint: "Short summary used on publication lists and at the top of publication pages." }
              - { label: "Source", name: "source", widget: "string", default: "NSLS" }
              - { label: "Date", name: "date", widget: "string", hint: "Example: May 21, 2026" }
              - { label: "Topics", name: "topics", widget: "list", field: { label: "Topic", name: "topic", widget: "string" }, required: false }
              - { label: "Image", name: "image", widget: "image", required: false, hint: "Upload an image or paste an external image URL." }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
              - { label: "Fallback Mark", name: "mark", widget: "string", required: false, hint: "Used when no image is set, e.g. NSLS." }
              - { label: "External URL", name: "url", widget: "string", required: false, hint: "Use for external pieces. On-site pages and PDFs use the slug unless you need a fallback URL." }
              - { label: "External Link", name: "external", widget: "boolean", required: false, default: false, hint: "Legacy field. New entries should use Publication Format instead." }
              - { label: "PDF Upload", name: "pdf", widget: "file", required: false, hint: "Use for PDF download entries." }
              - { label: "PDF Button Label", name: "pdfLabel", widget: "string", required: false, default: "Download PDF" }
              - { label: "Article Body", name: "body", widget: "markdown", required: false, hint: "Use for website articles. You can add hyperlinks with normal Markdown: [link text](https://example.com)." }
