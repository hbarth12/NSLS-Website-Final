<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--crimson:#177976;--serif:'Source Serif 4', Georgia, serif;}
body{margin:0;background:transparent;width:max-content;height:max-content;}
.logo{display:inline-flex;align-items:center;gap:0;background:var(--crimson);color:#fff;padding:18px 26px;text-decoration:none;}
.mark{color:#fff;font-family:var(--serif);font-size:54px;font-weight:600;line-height:1;}
.words{margin-left:22px;padding-left:22px;border-left:2px solid rgba(255,255,255,.45);display:flex;flex-direction:column;justify-content:center;gap:2px;}
.words strong,.words small{color:#fff;font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.14em;line-height:1.05;text-transform:uppercase;white-space:nowrap;}
</style></head><body><a class="logo"><span class="mark">NSLS</span><span class="words"><strong>Network for Syrian</strong><small>Legislative Studies</small></span></a></body></html>
